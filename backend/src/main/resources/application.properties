spring.config.import=optional:file:.env[.properties]
spring.application.name=smartplay-adaptive-learning
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/smartplay}
spring.data.mongodb.auto-index-creation=true
server.port=${PORT:8080}
server.servlet.session.cookie.same-site=strict
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
smartplay.content.storage-dir=${SMARTPLAY_CONTENT_STORAGE_DIR:./data/content}

# Python AI Recommendation Service
smartplay.ai.base-url=http://127.0.0.1:8000

# Relative to the backend working directory; never served as static content.
smartplay.content.grade-one-source-dir=${SMARTPLAY_GRADE_ONE_SOURCE_DIR:../AI-Recommendation/data/raw/original_files/teacher_guides}
